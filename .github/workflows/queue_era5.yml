name: Queue ERA5 Copernicus Jobs

on:
  workflow_dispatch: # Avvio manuale dalla tab Actions
  schedule:
    - cron: '15 */6 * * *' # Riparte automaticamente ogni 6 ore

jobs:
  queue-cds:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade requests cdsapi

      - name: Run CDS Queue Poller
        env:
          CDS_URL: ${{ secrets.CDS_URL }}
          CDS_KEY: ${{ secrets.CDS_KEY }}
        run: python queue_era5.py
