name: Queue ERA5 Copernicus Jobs

on:
  workflow_dispatch: # Avvio manuale con un click dalla tab "Actions"

jobs:
  queue-cds:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run CDS Queue Poller
        env:
          CDS_URL: ${{ secrets.CDS_URL }}
          CDS_KEY: ${{ secrets.CDS_KEY }}
        run: python queue_era5.py
