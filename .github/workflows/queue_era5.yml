name: Queue ERA5 Copernicus Jobs

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  queue-cds:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade requests cdsapi

      - name: Run CDS Queue Poller
        env:
          CDS_URL: ${{ secrets.CDS_URL }}
          CDS_KEY: ${{ secrets.CDS_KEY }}
        run: python queue_era5.py

      - name: Commit, Push State and Re-trigger if Pending
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cds_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CDS queue state" && git push)

          PENDING=$(python -c "import json; d=json.load(open('cds_state.json')); print(sum(1 for t in d if t['status']=='pending'))")
          echo "Task rimasti in stato pending: $PENDING"
          if [ "$PENDING" -gt "0" ]; then
            echo "Avvio automatico della prossima run..."
            gh workflow run queue_era5.yml --ref ${{ github.ref_name }}
          else
            echo "Tutti i task sono stati accodati! Nessun riavvio necessario."
          fi
