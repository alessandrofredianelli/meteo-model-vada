name: Queue ERA5 Copernicus Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '00 */1 * * *'

permissions:
  contents: write  # Necessario per salvare cds_state.json nel repository

jobs:
  queue-cds:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run CDS Queue Poller
        env:
          CDS_URL: ${{ secrets.CDS_URL }}
          CDS_KEY: ${{ secrets.CDS_KEY }}
        run: python queue_era5.py

      - name: Commit and Push State
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cds_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CDS queue state" && git push)
